<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12030a">
  <title>Một điều nhỏ dành cho bạn 💗</title>

  <!-- Font (có fallback hệ thống nếu offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NỀN: gradient đỏ → đen → tím, đốm sáng mềm, vignette, noise -->
  <div class="bg" aria-hidden="true">
    <div class="blob b1" data-depth="24"><i></i></div>
    <div class="blob b2" data-depth="16"><i></i></div>
    <div class="blob b3" data-depth="32"><i></i></div>
    <div class="blob b4" data-depth="12"><i></i></div>
    <div class="vignette"></div>
    <div class="noise"></div>
  </div>

  <!-- Canvas chính: ánh sáng, particle, trái tim lớn, heart burst -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <main>
    <!-- ============ MÀN HÌNH ĐẦU ============ -->
    <section id="intro" class="panel show">
      <form id="intro-form" class="intro-card" autocomplete="off" novalidate>
        <h1 class="intro-title">💗 Một điều nhỏ dành cho bạn...</h1>
        <div class="field" id="field">
          <label for="name-input" class="sr-only">Tên của bạn</label>
          <input id="name-input" type="text" maxlength="24" placeholder="Nhập tên của bạn"
                 autocomplete="off" autocapitalize="words" enterkeyhint="go" spellcheck="false">
        </div>
        <p id="hint" class="hint" role="status" aria-live="polite">Cho mình biết tên bạn nhé~ 🥺</p>
        <button id="btn-open" type="submit" class="btn">✨ Mở ra</button>
      </form>
    </section>

    <!-- ============ LỜI CHÀO ============ -->
    <section id="name-block" class="panel" aria-live="polite">
      <div class="name-inner">
        <h2 id="name-title" class="name-title"></h2>
        <p class="name-sub">Có một điều nhỏ mình muốn gửi đến bạn...</p>
      </div>
    </section>

    <!-- ============ PHONG THƯ ============ -->
    <section id="env-stage" class="panel">
      <div class="env-wrap">
        <div class="env-halo" aria-hidden="true"></div>
        <div class="env-float">
          <button id="envelope" class="envelope" type="button" aria-label="Mở phong thư">
            <span class="env-back"></span>
            <span class="env-glow"></span>
            <span class="env-paper"><i></i><i></i><i></i><i></i><i></i></span>
            <span class="env-front"><b class="l"></b><b class="r"></b><b class="b"></b></span>
            <span class="env-flap"></span>
            <span class="env-seal" aria-hidden="true">💗</span>
          </button>
        </div>
        <p id="env-hint" class="env-hint">Chạm vào phong thư ✨</p>
      </div>
    </section>

    <!-- ============ BỨC THƯ ============ -->
    <section id="letter-wrap" class="panel">
      <article id="letter" class="letter">
        <h3 id="letter-greet" class="letter-greet"></h3>
        <div id="letter-body" class="letter-body"></div>
        <p id="letter-sign" class="letter-sign"></p>
        <div id="letter-actions" class="letter-actions">
          <button type="button" id="btn-more" class="mini-btn">💗 Thả thêm tim</button>
          <button type="button" id="btn-again" class="mini-btn">↺ Xem lại</button>
        </div>
      </article>
    </section>
  </main>

  <!-- Canvas hiệu ứng tương tác (click, trail) nằm trên cùng -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Nút bật/tắt âm thanh (mặc định TẮT) -->
  <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Bật âm thanh" title="Bật/tắt âm thanh">🔇</button>

  <script src="script.js"></script>
</body>
</html>
